suite: test imagePullSecrets
release:
  name: test-release
  namespace: test-namespace
chart:
  name: kubedock-dns
  version: 0.1.0
tests:
  - it: should not have imagePullSecrets when not specified
    asserts:
      - isKind:
          of: Deployment
        template: dns-server.yaml
        documentIndex: 0
      - notExists:
          path: spec.template.spec.imagePullSecrets
        template: dns-server.yaml
        documentIndex: 0
  
  - it: should have imagePullSecrets when specified
    set:
      imagePullSecrets:
        - my-registry-secret
        - another-secret
    asserts:
      - isKind:
          of: Deployment
        template: dns-server.yaml
        documentIndex: 0
      - exists:
          path: spec.template.spec.imagePullSecrets
        template: dns-server.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: my-registry-secret
        template: dns-server.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.imagePullSecrets[1].name
          value: another-secret
        template: dns-server.yaml
        documentIndex: 0
  
  - it: should have single imagePullSecret when only one is specified
    set:
      imagePullSecrets:
        - single-secret
    asserts:
      - isKind:
          of: Deployment
        template: dns-server.yaml
        documentIndex: 0
      - exists:
          path: spec.template.spec.imagePullSecrets
        template: dns-server.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: single-secret
        template: dns-server.yaml
        documentIndex: 0
      - lengthEqual:
          path: spec.template.spec.imagePullSecrets
          count: 1
        template: dns-server.yaml
        documentIndex: 0
