suite: test fullnameOverride
release:
  name: test-release
  namespace: test-namespace
chart:
  name: kubedock-dns
  version: 0.1.0
tests:
  - it: should use fullnameOverride when specified
    set:
      fullnameOverride: custom-name
    asserts:
      - isKind:
          of: Deployment
        template: dns-server.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: custom-name
        template: dns-server.yaml
        documentIndex: 0
      - isKind:
          of: Service
        template: dns-server.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: custom-name-server
        template: dns-server.yaml
        documentIndex: 1
      - isKind:
          of: ServiceAccount
        template: dns-server-sa.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: custom-name-server
        template: dns-server-sa.yaml
        documentIndex: 0
      - isKind:
          of: Role
        template: dns-server-sa.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: custom-name-server
        template: dns-server-sa.yaml
        documentIndex: 1
      - isKind:
          of: RoleBinding
        template: dns-server-sa.yaml
        documentIndex: 2
      - equal:
          path: metadata.name
          value: custom-name-server
        template: dns-server-sa.yaml
        documentIndex: 2
      - isKind:
          of: Secret
        template: dns-mutator-config.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: custom-name-mutator-cert
        template: dns-mutator-config.yaml
        documentIndex: 0
      - isKind:
          of: MutatingWebhookConfiguration
        template: dns-mutator-config.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: test-namespace-dns-mutator-config
        template: dns-mutator-config.yaml
        documentIndex: 1
  
  - it: should use Release.Name when fullnameOverride is not specified
    asserts:
      - isKind:
          of: Deployment
        template: dns-server.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-release
        template: dns-server.yaml
        documentIndex: 0
      - isKind:
          of: Service
        template: dns-server.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: test-release-server
        template: dns-server.yaml
        documentIndex: 1
      - isKind:
          of: ServiceAccount
        template: dns-server-sa.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-release-server
        template: dns-server-sa.yaml
        documentIndex: 0
      - isKind:
          of: Role
        template: dns-server-sa.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: test-release-server
        template: dns-server-sa.yaml
        documentIndex: 1
      - isKind:
          of: RoleBinding
        template: dns-server-sa.yaml
        documentIndex: 2
      - equal:
          path: metadata.name
          value: test-release-server
        template: dns-server-sa.yaml
        documentIndex: 2
      - isKind:
          of: Secret
        template: dns-mutator-config.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-release-mutator-cert
        template: dns-mutator-config.yaml
        documentIndex: 0
      - isKind:
          of: MutatingWebhookConfiguration
        template: dns-mutator-config.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: test-namespace-dns-mutator-config
        template: dns-mutator-config.yaml
        documentIndex: 1
